[project]
name = "pinball-showcase"
version = "0.1.0"
description = "Pinball of the Day API for TRMNL e-ink displays, powered by the OPDB daily export"
readme = "README.md"
license = "MIT"
authors = [{ name = "Todd Murphy" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
pinball-showcase = "pinball_showcase.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Line length is enforced by `ruff format`; long string literals are fine.
ignore = ["E501", "RUF001"]
