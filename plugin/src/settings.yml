# ---- Theme and People --------------------------------------------------------------------
- keyname: keywords
  name: Title Keywords (Themes)
  group: "Theme and People"
  field_type: string
  optional: true
  placeholder: star wars, batman, monster, space
  description: "Optional. Show only machines whose title contains any of these words. Leave empty for every title."
- keyname: exclude_keywords
  name: Exclude Title Keywords
  group: "Theme and People"
  field_type: string
  optional: true
  description: "Optional. Skip machines whose title contains any of these words, comma-separated."
- keyname: people
  name: Designers and Artists
  group: "Theme and People"
  field_type: string
  optional: true
  placeholder: Steve Ritchie, Pat Lawlor, John Youssi
  description: "Optional. Comma-separated names of anyone credited (design, art, code, sound, music). Leave empty for everyone."

# ---- Machine Type ------------------------------------------------------------------------
- keyname: displays
  name: Score Display
  group: "Machine Type"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Leave empty for every kind of score display."
  options:
  - "Score reels": "reels"
  - "Alphanumeric": "alphanumeric"
  - "Backbox lights": "lights"
  - "Dot matrix": "dmd"
  - "LCD": "lcd"
  - "CGA monitor": "cga"
- keyname: players
  name: Player Count
  group: "Machine Type"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Leave empty for any player count."
  options:
  - "1 player": "1"
  - "2 players": "2"
  - "4 players": "4"
  - "6 players": "6"
- keyname: features
  name: Must Have
  group: "Machine Type"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Show machines with any of these. Leave empty for no requirement."
  options:
  - "Widebody": "widebody"
  - "Cocktail table": "cocktail"
  - "Add-a-ball": "add_a_ball"
  - "Replay": "replay"
  - "Head-to-head play": "head_to_head"
  - "Pro edition": "pro"
  - "Premium edition": "premium"
  - "Limited edition": "limited"
  - "Remake": "remake"
  - "Vault edition": "vault"
  - "Home model": "home"
  - "Export edition": "export"
  - "Conversion kit": "conversion"
  - "Multiple editions": "multi_edition"
- keyname: exclude_features
  name: Must Not Have
  group: "Machine Type"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Never show machines with any of these."
  options:
  - "Widebody": "widebody"
  - "Cocktail table": "cocktail"
  - "Add-a-ball": "add_a_ball"
  - "Replay": "replay"
  - "Head-to-head play": "head_to_head"
  - "Pro edition": "pro"
  - "Premium edition": "premium"
  - "Limited edition": "limited"
  - "Remake": "remake"
  - "Vault edition": "vault"
  - "Home model": "home"
  - "Export edition": "export"
  - "Conversion kit": "conversion"
  - "Multiple editions": "multi_edition"
- keyname: require_playfield
  name: Only Machines With Playfield Photos
  group: "Machine Type"
  field_type: boolean
  optional: true
  description: "Optional. Turn on to show only machines that have a playfield photo."
  default: false

# ---- Advanced ----------------------------------------------------------------------------
- keyname: api_url
  name: Self-hosted API URL
  group: "Advanced"
  field_type: url
  optional: true
  placeholder: https://pinball.example.com
  description: "Optional. Leave empty to use the hosted API. If you run your own copy (see GitHub), enter its address without a trailing slash."
