#
# Plugin definition, uploaded to TRMNL by `bin/trmnlp push`. Changes made in the TRMNL web
# editor are pulled back with `bin/trmnlp pull`. Add the `id:` TRMNL assigns after the
# first push so later pushes update the same plugin.
#
---
id: 497284
name: Pinball Showcase
description: A new pinball machine every day
framework_version: latest
recipe_overview: |-
  Pinball Showcase puts a different pinball machine on your TRMNL every day, drawn from the Open Pinball Database (OPDB) and its catalogue of more than fifteen hundred real machines, from 1930s bagatelles and electro-mechanical classics to dot matrix favorites and today's LCD games.

  Each screen shows the backglass or playfield artwork, dithered for e-ink, with the manufacturer, release date, machine type, score display, player count, editions, and the designers, artists, programmers and composers who made it. Fast facts put it in context: how old it is, where it sits in its maker's catalogue, and what else came out that year. A QR code opens the machine's full profile, with every photo, edition and link.

  Narrow the rotation to the machines you love. Mix and match eras, decades, year ranges, manufacturers, title keywords for themes, designers and artists, score display types, player counts and features like widebody or remake, or build your own favorites list. Every machine in your selection appears once before any repeats. Choose a new machine once a day, on a schedule, on every refresh, or shuffled, and pick the Showcase, Gallery or Spec Sheet layout. Works on TRMNL OG, TRMNL X and color B/W/R/Y screens, in every mashup size.
strategy: polling
polling_verb: get
polling_url: "{{ api_url | default: 'https://pinball-showcase.trmnlplugins.com' }}/api/v1/showcase?tz={{ trmnl.user.time_zone_iana | url_encode }}&rotation={{ rotation }}&interval={{ trmnl.plugin_settings.refresh_interval_minutes }}&avoid={{ trmnl.state.last_id }}&machine={{ pinned_machine | url_encode }}&favorites={{ favorites | url_encode }}&era={{ eras | join: ',' }}&decade={{ decades | join: ',' }}&min_year={{ min_year }}&max_year={{ max_year }}&manufacturer={{ manufacturers | join: ',' | url_encode }},{{ other_manufacturers | url_encode }}&exclude_manufacturer={{ exclude_manufacturers | join: ',' | url_encode }}&display={{ displays | join: ',' }}&players={{ players | join: ',' }}&feature={{ features | join: ',' }}&exclude_feature={{ exclude_features | join: ',' }}&keyword={{ keywords | url_encode }}&exclude_keyword={{ exclude_keywords | url_encode }}&person={{ people | url_encode }}&exclude_id={{ exclude_ids | url_encode }}&require_playfield={{ require_playfield }}"
polling_headers: ''
polling_body: ''
refresh_interval: 60
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
custom_fields:
# ---- Always visible: about, layout style and how often the machine changes ----------
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: games,entertainment
  github_url: https://github.com/pythcon/trmnl-plugin-pinball-showcase
  learn_more_url: https://trmnlplugins.com
  description: "A different pinball machine every day, with backglass and playfield art, release details, designers, editions and trivia from the Open Pinball Database (OPDB). Filter by era, decade, manufacturer, designer, theme and more, or rotate through your own favorites. Every setting below is optional: with none set you get a new machine from the whole catalogue on every refresh."
- keyname: display_mode
  name: Layout Style
  field_type: select
  optional: true
  description: "Optional. How to balance the artwork against the machine details. Starts on Showcase."
  options:
  - "Showcase (art and details)": "showcase"
  - "Gallery (art first)": "gallery"
  - "Spec Sheet (details first)": "spec"
  default: showcase
- keyname: rotation
  name: New Machine
  field_type: select
  optional: true
  description: "Optional. How often a new machine appears. Starts on Every refresh, so your playlist sets the pace. Every option except Shuffle shows each machine in your selection once before any repeats; Shuffle never shows the same machine twice in a row."
  options:
  - "Once a day (midnight, your time)": "daily"
  - "Every hour": "1h"
  - "Every 2 hours": "2h"
  - "Every 3 hours": "3h"
  - "Every 6 hours": "6h"
  - "Every 12 hours": "12h"
  - "Every refresh (follows this plugin's refresh rate)": "refresh"
  - "Shuffle (new machine on every refresh, even a forced one)": "shuffle"
  default: refresh

# ---- Photos ------------------------------------------------------------------------------
- keyname: art_full
  name: Photos - Full Screen
  group: "Photos"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Pick one, or several to show side by side (up to 3). Leave empty to choose automatically (the edition's own backglass or photo first). If an edition has no photo of a type, another edition's is used and labelled."
  options:
  - "Backglass": "backglass"
  - "Playfield": "playfield"
  - "Cabinet": "cabinet"
  - "None (text only)": "none"
- keyname: art_half_horizontal
  name: Photos - Half Horizontal
  group: "Photos"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Up to 2 side by side. Leave empty to choose automatically."
  options:
  - "Backglass": "backglass"
  - "Playfield": "playfield"
  - "Cabinet": "cabinet"
  - "None (text only)": "none"
- keyname: art_half_vertical
  name: Photos - Half Vertical
  group: "Photos"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Up to 2. Leave empty to choose automatically (playfield first, which fits the tall slot best)."
  options:
  - "Backglass": "backglass"
  - "Playfield": "playfield"
  - "Cabinet": "cabinet"
  - "None (text only)": "none"
- keyname: art_quadrant
  name: Photos - Quadrant
  group: "Photos"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Shows the first one you pick. Leave empty to choose automatically."
  options:
  - "Backglass": "backglass"
  - "Playfield": "playfield"
  - "Cabinet": "cabinet"
  - "None (text only)": "none"
- keyname: art_fit
  name: Photo Style
  group: "Photos"
  field_type: select
  optional: true
  description: "Optional. Starts on Fit, which shows the whole photo."
  options:
  - "Fit (show the whole photo)": "fit"
  - "Fill (crop to use all the space)": "fill"
  default: fit
- keyname: art_position
  name: Artwork Position
  group: "Photos"
  field_type: select
  optional: true
  description: "Optional. Starts on Left."
  options:
  - "Left (top in half vertical)": "left"
  - "Right (bottom in half vertical)": "right"
  default: left

# ---- What to Show ------------------------------------------------------------------------
- keyname: hide_details
  name: Hide Details
  group: "What to Show"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Everything is shown by default. Pick anything you'd rather hide."
  options:
  - "Credits (design, art, code, sound)": "credits"
  - "Fast facts": "facts"
  - "Fun fact": "fun_fact"
  - "Feature tags (widebody, cocktail...)": "tags"
  - "QR code to the machine page": "qr"
- keyname: color_accents
  name: Color Accents
  group: "What to Show"
  field_type: select
  optional: true
  description: "Optional. Starts on On: red and yellow on color screens, gray elsewhere."
  options:
  - "On (red and yellow on color screens, gray elsewhere)": "on"
  - "Off (pure black and white)": "off"
  default: "on"

# ---- Pick Machines -----------------------------------------------------------------------
- keyname: pinned_machine
  name: Pin One Machine
  group: "Pick Machines"
  field_type: string
  optional: true
  placeholder: G5pe4
  description: "Optional. Always show this machine instead of rotating. Search pinball-showcase.trmnlplugins.com and copy the id from the page address; an edition's id (e.g. GWyBj-MdEbK-AOPdq) pins that exact edition."
- keyname: favorites
  name: Favorites Only
  group: "Pick Machines"
  field_type: text
  rows: 2
  optional: true
  placeholder: G5pe4, GrqZX, GweeP
  description: "Optional. Comma-separated OPDB ids (find them with the search at pinball-showcase.trmnlplugins.com). When set, only these machines rotate; other filters still apply. Leave empty to rotate through everything."
- keyname: exclude_ids
  name: Never Show
  group: "Pick Machines"
  field_type: text
  rows: 2
  optional: true
  placeholder: G4ODR, GRBE4
  description: "Optional. Comma-separated OPDB ids to skip."

# ---- Era and Year ------------------------------------------------------------------------
- keyname: eras
  name: Eras
  group: "Era and Year"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Leave empty for every era."
  options:
  - "Electro-mechanical": "em"
  - "Early solid state (alphanumeric, lights)": "early_ss"
  - "Dot matrix era": "dmd"
  - "Modern LCD era": "modern"
- keyname: decades
  name: Decades
  group: "Era and Year"
  field_type: select
  multiple: true
  optional: true
  description: "Optional. Leave empty for every decade."
  options:
  - "1940s": "1940"
  - "1950s": "1950"
  - "1960s": "1960"
  - "1970s": "1970"
  - "1980s": "1980"
  - "1990s": "1990"
  - "2000s": "2000"
  - "2010s": "2010"
  - "2020s": "2020"
- keyname: min_year
  name: From Year
  group: "Era and Year"
  field_type: number
  optional: true
  min: 1930
  max: 2100
  placeholder: 1978
  description: "Optional. The earliest release year to show. Leave empty for no lower limit."
- keyname: max_year
  name: To Year
  group: "Era and Year"
  field_type: number
  optional: true
  min: 1930
  max: 2100
  placeholder: 1999
  description: "Optional. The latest release year to show. Leave empty for no upper limit."

