#
# Plugin definition, uploaded to TRMNL by `bin/trmnlp push`. Changes made in the TRMNL web
# editor are pulled back with `bin/trmnlp pull`. Add the `id:` TRMNL assigns after the
# first push so later pushes update the same plugin.
#
---
name: Pinball Showcase
description: A new pinball machine every day
framework_version: latest
recipe_overview: |-
  Pinball Showcase puts a different pinball machine on your TRMNL every day, drawn from the Open Pinball Database (OPDB) and its catalogue of more than fifteen hundred real machines, from 1930s bagatelles and electro-mechanical classics to dot matrix favorites and today's LCD games.

  Each screen shows the backglass or playfield artwork, dithered for e-ink, with the manufacturer, release date, machine type, score display, player count, editions, and the designers, artists, programmers and composers who made it. Fast facts put it in context: how old it is, where it sits in its maker's catalogue, and what else came out that year. A QR code links to the full OPDB entry.

  Narrow the rotation to the machines you love. Mix and match eras, decades, year ranges, manufacturers, title keywords for themes, designers and artists, score display types, player counts and features like widebody or remake, or build your own favorites list. Every machine in your selection appears once before any repeats. Choose daily, twice daily, four times a day or hourly changes, and pick the Showcase, Gallery or Spec Sheet layout. Works on TRMNL OG, TRMNL X and color B/W/R/Y screens, in every mashup size.
strategy: polling
polling_verb: get
polling_url: "{{ api_url | default: 'https://pinball.trmnlplugins.com' }}/api/v1/showcase?tz={{ trmnl.user.time_zone_iana | url_encode }}&rotation={{ rotation }}&machine={{ pinned_machine | url_encode }}&favorites={{ favorites | url_encode }}&era={{ eras | join: ',' }}&decade={{ decades | join: ',' }}&min_year={{ min_year }}&max_year={{ max_year }}&manufacturer={{ manufacturers | url_encode }}&exclude_manufacturer={{ exclude_manufacturers | url_encode }}&display={{ displays | join: ',' }}&players={{ players | join: ',' }}&feature={{ features | join: ',' }}&exclude_feature={{ exclude_features | join: ',' }}&keyword={{ keywords | url_encode }}&exclude_keyword={{ exclude_keywords | url_encode }}&person={{ people | url_encode }}&exclude_id={{ exclude_ids | url_encode }}&require_playfield={{ require_playfield }}"
polling_headers: ''
polling_body: ''
refresh_interval: 60
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: games,entertainment
  description: A different pinball machine every day, with backglass and playfield art, release details, designers, editions and trivia from the Open Pinball Database (OPDB). Filter by era, decade, manufacturer, designer, theme and more, or rotate through your own favorites.
  github_url: https://github.com/pythcon/trmnl-plugin-pinball-showcase
  learn_more_url: https://trmnlplugins.com

# ---- Look ------------------------------------------------------------------------------
- keyname: display_mode
  name: Layout Style
  field_type: select
  options:
  - "Showcase (art and details): showcase"
  - "Gallery (art first): gallery"
  - "Spec Sheet (details first): spec"
  default: showcase
  description: How to balance the artwork against the machine details.
- keyname: art_full
  name: Photos - Full Screen
  field_type: select
  multiple: true
  optional: true
  options:
  - "Backglass: backglass"
  - "Playfield: playfield"
  - "Cabinet: cabinet"
  - "None (text only): none"
  description: Pick one, or several to show side by side (up to 3). Leave empty for the backglass. Photos a machine doesn't have are skipped.
- keyname: art_half_horizontal
  name: Photos - Half Horizontal
  field_type: select
  multiple: true
  optional: true
  options:
  - "Backglass: backglass"
  - "Playfield: playfield"
  - "Cabinet: cabinet"
  - "None (text only): none"
  description: Up to 2 side by side. Leave empty for the backglass.
- keyname: art_half_vertical
  name: Photos - Half Vertical
  field_type: select
  multiple: true
  optional: true
  options:
  - "Backglass: backglass"
  - "Playfield: playfield"
  - "Cabinet: cabinet"
  - "None (text only): none"
  description: Up to 2. Leave empty for the playfield, which fits the tall slot best.
- keyname: art_quadrant
  name: Photos - Quadrant
  field_type: select
  multiple: true
  optional: true
  options:
  - "Backglass: backglass"
  - "Playfield: playfield"
  - "Cabinet: cabinet"
  - "None (text only): none"
  description: Shows the first one you pick. Leave empty for the backglass.
- keyname: art_fit
  name: Photo Style
  field_type: select
  options:
  - "Fit (show the whole photo): fit"
  - "Fill (crop to use all the space): fill"
  default: fit
- keyname: art_position
  name: Artwork Position
  field_type: select
  options:
  - "Left (top in half vertical): left"
  - "Right (bottom in half vertical): right"
  default: left
- keyname: hide_details
  name: Hide Details
  field_type: select
  multiple: true
  optional: true
  description: Everything is shown by default. Pick anything you'd rather hide.
  options:
  - "Credits (design, art, code, sound): credits"
  - "Fast facts: facts"
  - "Fun fact: fun_fact"
  - "Edition and feature tags: tags"
  - "Other titles from the same year: same_year"
  - "QR code to the OPDB page: qr"
- keyname: color_accents
  name: Color Accents
  field_type: select
  options:
  - "On (red and yellow on color screens, gray elsewhere): on"
  - "Off (pure black and white): off"
  default: "on"

# ---- Rotation ---------------------------------------------------------------------------
- keyname: rotation
  name: New Machine Every
  field_type: select
  options:
  - "Day: daily"
  - "12 hours: 12h"
  - "6 hours: 6h"
  - "Hour: hourly"
  default: daily
  description: Every machine in your selection is shown once before any repeats.
- keyname: pinned_machine
  name: Pin One Machine
  field_type: string
  optional: true
  placeholder: G5pe4
  description: Always show this OPDB id instead of rotating. Find ids at opdb.org.
- keyname: favorites
  name: Favorites Only
  field_type: text
  rows: 2
  optional: true
  placeholder: G5pe4, GrqZX, GweeP
  description: Comma-separated OPDB ids. When set, only these machines rotate (other filters still apply).

# ---- Filters (pick any combination; empty = everything) ---------------------------------
- keyname: eras
  name: Eras
  field_type: select
  multiple: true
  optional: true
  options:
  - "Electro-mechanical: em"
  - "Early solid state (alphanumeric, lights): early_ss"
  - "Dot matrix era: dmd"
  - "Modern LCD era: modern"
- keyname: decades
  name: Decades
  field_type: select
  multiple: true
  optional: true
  options:
  - "1930s: 1930"
  - "1940s: 1940"
  - "1950s: 1950"
  - "1960s: 1960"
  - "1970s: 1970"
  - "1980s: 1980"
  - "1990s: 1990"
  - "2000s: 2000"
  - "2010s: 2010"
  - "2020s: 2020"
- keyname: min_year
  name: From Year
  field_type: number
  optional: true
  min: 1930
  max: 2100
  placeholder: 1978
- keyname: max_year
  name: To Year
  field_type: number
  optional: true
  min: 1930
  max: 2100
  placeholder: 1999
- keyname: manufacturers
  name: Manufacturers
  field_type: string
  optional: true
  placeholder: Williams, Bally, Stern
  description: Comma-separated. Partial names match ("stern" also matches Stern Electronics).
- keyname: exclude_manufacturers
  name: Exclude Manufacturers
  field_type: string
  optional: true
  placeholder: Gottlieb
- keyname: keywords
  name: Title Keywords (Themes)
  field_type: string
  optional: true
  placeholder: star wars, batman, monster, space
  description: Show only machines whose title contains any of these words.
- keyname: exclude_keywords
  name: Exclude Title Keywords
  field_type: string
  optional: true
- keyname: people
  name: Designers and Artists
  field_type: string
  optional: true
  placeholder: Steve Ritchie, Pat Lawlor, John Youssi
  description: Comma-separated names of anyone credited (design, art, code, sound, music).
- keyname: displays
  name: Score Display
  field_type: select
  multiple: true
  optional: true
  options:
  - "Score reels: reels"
  - "Backbox lights: lights"
  - "Alphanumeric: alphanumeric"
  - "Dot matrix: dmd"
  - "LCD: lcd"
  - "CGA monitor: cga"
- keyname: players
  name: Player Count
  field_type: select
  multiple: true
  optional: true
  options:
  - "1 player: 1"
  - "2 players: 2"
  - "4 players: 4"
  - "6 players: 6"
- keyname: features
  name: Must Have
  field_type: select
  multiple: true
  optional: true
  description: Show machines with any of these.
  options:
  - "Widebody: widebody"
  - "Cocktail table: cocktail"
  - "Add-a-ball: add_a_ball"
  - "Replay: replay"
  - "Head-to-head play: head_to_head"
  - "Multiple editions: multi_edition"
  - "Pro edition: pro"
  - "Premium edition: premium"
  - "Limited edition: limited"
  - "Remake: remake"
  - "Vault edition: vault"
  - "Home model: home"
  - "Export edition: export"
  - "Conversion kit: conversion"
- keyname: exclude_features
  name: Must Not Have
  field_type: select
  multiple: true
  optional: true
  options:
  - "Widebody: widebody"
  - "Cocktail table: cocktail"
  - "Add-a-ball: add_a_ball"
  - "Replay: replay"
  - "Head-to-head play: head_to_head"
  - "Multiple editions: multi_edition"
  - "Pro edition: pro"
  - "Premium edition: premium"
  - "Limited edition: limited"
  - "Remake: remake"
  - "Vault edition: vault"
  - "Home model: home"
  - "Export edition: export"
  - "Conversion kit: conversion"
- keyname: require_playfield
  name: Only Machines With Playfield Photos
  field_type: select
  options:
  - "No: false"
  - "Yes: true"
  default: "false"
- keyname: exclude_ids
  name: Never Show
  field_type: text
  rows: 2
  optional: true
  placeholder: G4ODR, GRBE4
  description: Comma-separated OPDB ids to skip.

# ---- Advanced ---------------------------------------------------------------------------
- keyname: api_url
  name: Self-hosted API URL
  field_type: url
  optional: true
  placeholder: https://pinball.example.com
  description: Leave empty to use the hosted API. If you run your own copy (see GitHub), enter its address without a trailing slash.
