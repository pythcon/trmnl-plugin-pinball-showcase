# trmnlp local dev config (not uploaded to TRMNL).
# `make preview` runs the API locally and opens this viewer against it
# (PINBALL_API_URL). Without it, `bin/trmnlp serve` polls the hosted API.
---
watch:
  - .trmnlp.yml
  - src

time_zone: America/New_York

custom_fields:
  api_url: "{{ env.PINBALL_API_URL }}"
  display_mode: showcase
  art_fit: fit
  art_position: left
  color_accents: "on"
  rotation: daily

variables:
  trmnl:
    plugin_settings:
      instance_name: Pinball of the Day
