name: Plugin

on:
  push:
    branches: [master]
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite tests/snapshots and upload them
        type: boolean
        default: false

# Runs on the repo's self-hosted runner (needs Docker for the trmnlp image).

env:
  # Pin a release (trmnl/trmnlp:vX.Y.Z) for fully repeatable runs.
  TRMNLP_IMAGE: trmnl/trmnlp:latest

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD/plugin":/plugin "$TRMNLP_IMAGE" lint

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: trmnlp test (every view on OG, OG 2-bit, X, portrait and B/W/R/Y)
        run: >
          docker run --rm -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md
          -v "$PWD/plugin":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md "$TRMNLP_IMAGE"
          test --report report ${{ inputs.update_snapshots && '--update' || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trmnlp-report
          path: plugin/report

  # Publishes markup + settings to TRMNL plugin `id` in plugin/src/settings.yml, on every
  # push to master that touches the plugin, or by hand (Run workflow on master). Off unless
  # the repository variable TRMNL_PUSH is "true" and the TRMNL_API_KEY secret exists.
  push:
    needs: [lint, test]
    if: >-
      github.ref == 'refs/heads/master' && vars.TRMNL_PUSH == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -e TRMNL_API_KEY -v "$PWD/plugin":/plugin "$TRMNLP_IMAGE" push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
