# Production stack. Lives on the server at $DEPLOY_PATH next to a .env that the
# deploy workflow writes (ENV_PRODUCTION secret + IMAGE_TAG). Host nginx terminates
# TLS and proxies to the API, which only listens on localhost.
services:
  api:
    image: ghcr.io/pythcon/trmnl-plugin-pinball-showcase:${IMAGE_TAG:-latest}
    container_name: trmnl-plugin-pinball-showcase
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PINBALL_HOST_PORT:-8082}:8080"
    volumes:
      - pinball-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pinball-data:
