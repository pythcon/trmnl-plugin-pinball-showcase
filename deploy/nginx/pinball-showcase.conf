# /etc/nginx/conf.d/pinball-showcase.conf on the TRMNL plugins server.
# Installed once by hand (see deploy/DEPLOYMENT.md), not on every deploy: this
# nginx also serves the other plugins, and a bad reload would take them down too.
server {
  listen 80;
  listen [::]:80;
  server_name pinball-showcase.trmnlplugins.com;

  location /.well-known/ {
    allow all;
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name pinball-showcase.trmnlplugins.com;
  ssl_certificate /etc/letsencrypt/live/pinball-showcase.trmnlplugins.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pinball-showcase.trmnlplugins.com/privkey.pem;

  location /.well-known/ {
    allow all;
    root /var/www/html;
  }

  location / {
    # Cloudflare sits in front; trust its address ranges for the client IP.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header X-Forwarded-For;

    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }
}
